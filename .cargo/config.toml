# Static CRT linkage — eliminates "Visual C++ Redistributable not installed" errors.
# Users can install the wheel on ANY Windows machine without any prerequisites.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.i686-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
